version: 2
updates:
  # JS (root workspace + apps/web)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-deps:
        patterns:
          - "*"

  # Python (ETL)
  - package-ecosystem: "pip"
    directory: "/etl"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Android (Gradle)
  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

