name: Android Nightly Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

jobs:
  full-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: unit-tests-all
            task: ":app:test"
            idle_timeout: "180"
            max_duration: "3600"
          - name: assemble-dev-debug
            task: ":app:assembleDevDebug"
            idle_timeout: "120"
            max_duration: "1800"
          - name: assemble-staging-debug
            task: ":app:assembleStagingDebug"
            idle_timeout: "120"
            max_duration: "1800"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run ${{ matrix.target.name }} with watchdog
        env:
          STAGING_BASE_URL: https://ca-regshieldca-web-stg.blackhill-0c2251ca.westus2.azurecontainerapps.io
        run: |
          mkdir -p .tmp/android-gate
          LOG_FILE=".tmp/android-gate/nightly-${{ matrix.target.name }}.log"
          python3 scripts/android_gradle_watchdog.py \
            --idle-timeout-sec "${{ matrix.target.idle_timeout }}" \
            --max-duration-sec "${{ matrix.target.max_duration }}" \
            --log-file "$LOG_FILE" \
            -- \
            ./gradlew --no-daemon -Dorg.gradle.workers.max=2 \
            ${{ matrix.target.task }} \
            -PREGSHIELD_STAGING_BASE_URL="$STAGING_BASE_URL"

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-nightly-logs-${{ matrix.target.name }}
          path: .tmp/android-gate/*.log
          if-no-files-found: warn
