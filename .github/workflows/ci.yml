name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm run test

      - run: npx playwright install --with-deps
      - run: npm run test:e2e

  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m pip install -r etl/requirements.txt
      - run: python3 -m pytest -q etl/tests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:test :app:assembleStagingDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-staging-debug-apk
          path: apps/android/app/build/outputs/apk/staging/debug/*.apk
          if-no-files-found: error
