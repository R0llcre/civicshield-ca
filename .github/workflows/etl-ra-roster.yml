name: ETL - DOJ R&A Roster

on:
  workflow_dispatch:
  schedule:
    # 06:00 America/Los_Angeles ~= 14:00 UTC (07:00 during DST).
    - cron: "0 14 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 -m pip install -r etl/requirements.txt

      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 etl/ra_roster_etl.py --output-json etl_output.jsonl

      - name: Upload parse output (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl_output
          path: etl_output.jsonl

